<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Meeting Buddy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>

<body class="min-h-screen bg-[#202124] text-slate-100 flex items-center justify-center px-4 relative overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-[#8ab4f8] rounded-full mix-blend-multiply filter blur-[128px] opacity-10"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-10"></div>

    <div class="w-full max-w-md bg-[#28292c] border border-white/10 rounded-2xl p-8 shadow-2xl z-10">
        <div class="flex flex-col items-center text-center gap-3 mb-8">
            <div class="size-14 rounded-full bg-[#3c4043] flex items-center justify-center shadow-inner mb-2 border border-white/5">
                <svg class="size-7 text-[#8ab4f8]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">AI Meeting Buddy</h1>
                <p class="text-sm text-slate-400 mt-1">Enterprise Workspace Login</p>
            </div>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" for="email">Email</label>
                <input id="email" type="email" required
                    class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8] focus:ring-1 focus:ring-[#8ab4f8] transition-all placeholder:text-slate-500" placeholder="name@company.com" />
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" for="password">Password</label>
                <input id="password" type="password" required
                    class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8] focus:ring-1 focus:ring-[#8ab4f8] transition-all placeholder:text-slate-500" placeholder="••••••••" />
            </div>
            <button type="submit"
                class="w-full rounded-xl bg-[#8ab4f8] hover:bg-[#aecbfa] text-slate-900 py-3 font-bold text-sm shadow-md transition-colors mt-2">Sign In</button>
        </form>

        <p id="errorMsg" class="hidden mt-4 text-sm text-rose-400 text-center font-medium bg-rose-500/10 py-2 rounded-lg border border-rose-500/20"></p>
        <p class="mt-6 text-xs text-slate-500 text-center">Accounts are manager-controlled. Contact your admin for access.</p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.ok) {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.classList.remove('hidden');
                    return;
                }
                window.location.href = '/dashboard';
            } catch {
                errorMsg.textContent = 'Could not reach server';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
