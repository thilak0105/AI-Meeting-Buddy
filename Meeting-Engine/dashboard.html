<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Meeting Buddy - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, -apple-system, sans-serif; } </style>
</head>

<body class="min-h-screen bg-[#202124] text-slate-100">
    <div id="upcomingNotification" class="fixed top-20 right-6 z-50 bg-[#8ab4f8] text-slate-900 px-6 py-4 rounded-xl shadow-2xl transition-all duration-500 transform translate-x-[150%] opacity-0 flex items-center gap-4">
        <div class="p-2 bg-white/20 rounded-full">
            <svg class="size-6 text-slate-900 animate-pulse" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" /></svg>
        </div>
        <div>
            <h3 class="font-bold text-sm">Meeting starting soon!</h3>
            <p id="notificationText" class="text-xs font-medium opacity-80 mt-0.5">Your meeting starts in 5 minutes.</p>
        </div>
        <button id="notificationJoinBtn" class="ml-2 bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-800 transition-colors shadow-sm">Join Room</button>
        <button id="notificationCloseBtn" class="absolute -top-2 -right-2 bg-slate-900 text-white rounded-full p-1 hover:scale-110 transition-transform"><svg class="size-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
    </div>

    <header class="border-b border-white/10 bg-[#28292c] sticky top-0 z-20 shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="size-10 rounded-full bg-[#3c4043] flex items-center justify-center border border-white/10">
                    <svg class="size-6 text-[#8ab4f8]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" /></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Workspace Dashboard</h1>
                    <p id="userMeta" class="text-xs text-slate-400 font-medium"></p>
                </div>
            </div>
            <button id="logoutBtn" class="px-5 py-2 rounded-xl bg-[#3c4043] hover:bg-white/10 text-white text-sm font-semibold transition-colors border border-white/5">Logout</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="lg:col-span-2 space-y-8">
            
            <div class="bg-[#28292c] border border-white/10 rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
                    Join a Meeting
                </h2>
                <form id="joinMeetingForm" class="flex flex-col sm:flex-row gap-3">
                    <input id="joinMeetingId" placeholder="Paste meeting link or ID here..." required
                        class="flex-1 rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8] focus:ring-1 focus:ring-[#8ab4f8] placeholder:text-slate-500" />
                    <button type="submit" class="rounded-xl bg-[#8ab4f8] hover:bg-[#aecbfa] text-slate-900 font-bold px-8 py-3 transition-colors shadow-sm">Join</button>
                </form>
            </div>

            <div id="managerCreateCard" class="hidden bg-[#28292c] border border-white/10 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#8ab4f8]"></div>
                
                <div class="flex items-center gap-4 mb-6 border-b border-white/10 pb-2">
                    <button id="tabInstant" class="text-sm font-bold uppercase tracking-wider pb-2 border-b-2 border-[#8ab4f8] text-[#8ab4f8] transition-colors">Start Instantly</button>
                    <button id="tabSchedule" class="text-sm font-bold uppercase tracking-wider pb-2 border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition-colors">Schedule for Later</button>
                </div>
                
                <form id="instantMeetingForm" class="grid grid-cols-1 gap-4">
                    <input id="instantMeetingName" placeholder="Meeting Name *" required class="rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8]" />
                    <textarea id="instantMeetingDescription" placeholder="Agenda / Description (optional)" class="rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 h-20 outline-none focus:border-[#8ab4f8] resize-none"></textarea>
                    <button type="submit" class="rounded-xl bg-white hover:bg-slate-200 text-slate-900 py-3 font-bold mt-2 transition-colors flex items-center justify-center gap-2">
                        <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l2.29 2.29c.63.63 1.71.18 1.71-.71V8.91c0-.89-1.08-1.34-1.71-.71L17 10.5zM15 16H5V8h10v8z"/></svg>
                        Enter Room Now
                    </button>
                </form>

                <form id="scheduleMeetingForm" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="scheduleMeetingName" placeholder="Meeting Name *" required class="md:col-span-2 rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8]" />
                    <textarea id="scheduleMeetingDescription" placeholder="Agenda / Description (optional)" class="md:col-span-2 rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 h-20 outline-none focus:border-[#8ab4f8] resize-none"></textarea>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Starts At *</label>
                        <input id="scheduleStartsAt" type="datetime-local" required class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-2.5 outline-none focus:border-[#8ab4f8] color-scheme-dark" style="color-scheme: dark;" />
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Ends At <span class="normal-case text-slate-500 font-normal">(auto: +40 min)</span></label>
                        <input id="scheduleEndsAt" type="datetime-local" readonly class="w-full rounded-xl bg-[#3c4043]/60 border border-white/5 text-slate-400 px-4 py-2.5 outline-none cursor-not-allowed" style="color-scheme: dark;" />
                    </div>
                    <button type="submit" class="md:col-span-2 rounded-xl bg-[#8ab4f8] hover:bg-[#aecbfa] text-slate-900 py-3 font-bold mt-2 transition-colors flex items-center justify-center gap-2">
                        <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg>
                        Schedule Meeting
                    </button>
                </form>
            </div>

            <div>
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg>
                    Upcoming Schedule
                </h2>
                <div id="upcomingList" class="grid gap-3"></div>
            </div>

            <div class="pt-4 border-t border-white/10">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                    Past Meetings
                </h2>
                <div id="historyList" class="grid gap-3 opacity-80"></div>
            </div>

            <!-- ── PROJECT SUMMARIES ──────────────────────────────────── -->
            <div id="projectSummariesSection" class="hidden pt-4 border-t border-white/10">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" /></svg>
                    Project Summaries
                </h2>
                <div id="projectSummariesList" class="grid gap-3"></div>
            </div>
        </section>

        <aside class="space-y-8">
            <div id="managerUserCard" class="hidden bg-[#28292c] border border-white/10 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4">Create User Account</h2>
                <form id="createUserForm" class="space-y-4">
                    <input id="newUserName" placeholder="Full Name" required class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-emerald-500 placeholder:text-slate-500" />
                    <input id="newUserEmail" type="email" placeholder="Email Address" required class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-emerald-500 placeholder:text-slate-500" />
                    <input id="newUserPassword" type="password" minlength="8" placeholder="Temporary Password" required class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-emerald-500 placeholder:text-slate-500" />
                    <select id="newUserRole" class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-emerald-500 appearance-none">
                        <option value="employee">Role: Employee</option>
                        <option value="manager">Role: Manager</option>
                    </select>
                    <button type="submit" class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 py-3 font-bold transition-colors shadow-sm">Provision User</button>
                </form>
            </div>

            <!-- ── TASK BOARD ──────────────────────────────────────────── -->
            <div id="taskBoardCard" class="hidden bg-[#28292c] border border-white/10 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">My Tasks</h2>
                </div>

                <!-- Columns -->
                <div id="taskBoardColumns" class="space-y-4">
                    <!-- TODO -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="size-2 rounded-full bg-slate-400"></span> To Do
                                <span id="todoCount" class="ml-1 bg-[#3c4043] text-slate-400 text-[9px] px-1.5 py-0.5 rounded-full font-mono">0</span>
                            </span>
                            <button id="addTaskBtn" class="text-[10px] font-bold text-[#8ab4f8] hover:text-white transition-colors flex items-center gap-1">
                                <svg class="size-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                                Add Task
                            </button>
                        </div>
                        <div id="todoList" class="space-y-2 min-h-[40px]"></div>
                    </div>
                    <!-- IN PROGRESS -->
                    <div>
                        <div class="flex items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="size-2 rounded-full bg-amber-400"></span> In Progress
                                <span id="inProgressCount" class="ml-1 bg-[#3c4043] text-slate-400 text-[9px] px-1.5 py-0.5 rounded-full font-mono">0</span>
                            </span>
                        </div>
                        <div id="inProgressList" class="space-y-2 min-h-[40px]"></div>
                    </div>
                    <!-- DONE -->
                    <div>
                        <div class="flex items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="size-2 rounded-full bg-emerald-400"></span> Done
                                <span id="doneCount" class="ml-1 bg-[#3c4043] text-slate-400 text-[9px] px-1.5 py-0.5 rounded-full font-mono">0</span>
                            </span>
                        </div>
                        <div id="doneList" class="space-y-2 min-h-[40px]"></div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Project Summary Modal -->
    <div id="projectSummaryModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-[#28292c] border border-white/10 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between p-6 border-b border-white/10 shrink-0">
          <h3 id="modalProjectName" class="text-lg font-bold text-white"></h3>
          <button id="closeModalBtn" class="p-2 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition-colors">
            <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <div id="modalSummaryContent" class="flex-1 overflow-y-auto p-6 prose prose-invert prose-sm max-w-none text-slate-300"></div>
      </div>
    </div>

    <!-- Add Task Modal -->
    <div id="addTaskModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-[#28292c] border border-white/10 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="flex items-center justify-between p-6 border-b border-white/10">
          <h3 class="text-base font-bold text-white">Add Task</h3>
          <button id="closeAddTaskModalBtn" class="p-2 rounded-full hover:bg-white/10 text-slate-400 transition-colors">
            <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <form id="addTaskForm" class="p-6 space-y-4">
          <input id="addTaskTitle" placeholder="Task title *" required class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 outline-none focus:border-[#8ab4f8] placeholder:text-slate-500" />
          <textarea id="addTaskDescription" placeholder="Description (optional)" class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-3 h-20 outline-none focus:border-[#8ab4f8] resize-none placeholder:text-slate-500"></textarea>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1 block">Priority</label>
              <select id="addTaskPriority" class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-2.5 outline-none">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1 block">Status</label>
              <select id="addTaskStatus" class="w-full rounded-xl bg-[#3c4043] border border-white/10 text-white px-4 py-2.5 outline-none">
                <option value="todo" selected>To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full rounded-xl bg-[#8ab4f8] hover:bg-[#aecbfa] text-slate-900 py-3 font-bold transition-colors">Add Task</button>
        </form>
      </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
